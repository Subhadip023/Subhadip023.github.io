<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminer Lite — Login</title>
    <meta name="description" content="Lightweight Adminer-inspired panel (login) powered by Tailwind CDN." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 400: '#7c8fff', 500: '#5164ff', 600: '#394fe0' },
              ink: '#0b1221'
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-50 flex items-center justify-center px-4">
    <main class="w-full max-w-md space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-500 shadow-lg shadow-brand-500/30">
          <span class="text-lg font-semibold text-white">A</span>
        </div>
        <h1 class="text-2xl font-semibold">Adminer Lite</h1>
        <p class="text-slate-300 text-sm">Mock DB admin panel — no backend required.</p>
      </div>
      <form class="rounded-2xl border border-white/10 bg-white/5 p-6 space-y-4" action="./dashboard.html" method="get">
        <label class="space-y-2 block">
          <span class="text-sm text-slate-200">Server</span>
          <input class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white placeholder:text-slate-400 focus:border-brand-400 focus:outline-none" name="server" placeholder="localhost:5432" required />
        </label>
        <label class="space-y-2 block">
          <span class="text-sm text-slate-200">User</span>
          <input class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white placeholder:text-slate-400 focus:border-brand-400 focus:outline-none" name="user" placeholder="admin" required />
        </label>
        <label class="space-y-2 block">
          <span class="text-sm text-slate-200">Password</span>
          <input class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white placeholder:text-slate-400 focus:border-brand-400 focus:outline-none" type="password" name="password" placeholder="••••••••" required />
        </label>
        <label class="space-y-2 block">
          <span class="text-sm text-slate-200">Database</span>
          <input class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white placeholder:text-slate-400 focus:border-brand-400 focus:outline-none" name="database" placeholder="demo" />
        </label>
        <button class="w-full inline-flex items-center justify-center px-4 py-2 rounded-lg bg-brand-500 hover:bg-brand-400 text-white font-semibold shadow-lg shadow-brand-500/30" type="submit">Enter panel</button>
        <p class="text-xs text-slate-400">Demo-only — form redirects without validation.</p>
      </form>
    </main>
  </body>
</html>
