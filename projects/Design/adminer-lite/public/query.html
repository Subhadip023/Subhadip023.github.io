<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminer Lite — SQL Console</title>
    <meta name="description" content="Run ad-hoc queries in Adminer Lite (demo-only, client-side)." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { brand: { 500: '#5164ff', 400: '#7c8fff' } } } } };
    </script>
  </head>
  <body class="bg-slate-950 text-slate-50">
    <div class="min-h-screen grid lg:grid-cols-[260px_1fr]">
      <aside class="border-r border-white/5 bg-white/5 flex flex-col">
        <div class="p-4 flex items-center gap-2 text-lg font-semibold">
          <div class="h-9 w-9 rounded-xl bg-brand-500 flex items-center justify-center text-white">A</div>
          <div>
            <div>Adminer Lite</div>
            <p class="text-xs text-slate-300">demo</p>
          </div>
        </div>
        <nav class="px-3 space-y-2 text-sm">
          <a class="block px-3 py-2 rounded-lg hover:bg-white/5" href="./dashboard.html">Dashboard</a>
          <a class="block px-3 py-2 rounded-lg hover:bg-white/5" href="./tables.html">Tables</a>
          <a class="block px-3 py-2 rounded-lg bg-white/10" href="./query.html">SQL Console</a>
          <a class="block px-3 py-2 rounded-lg hover:bg-white/5" href="./login.html">Logout</a>
        </nav>
        <div class="mt-auto p-4 text-xs text-slate-300">Console — read-only demo</div>
      </aside>

      <main class="p-5 lg:p-8 space-y-6">
        <header class="flex flex-wrap items-center gap-4 justify-between">
          <div>
            <p class="text-sm text-slate-300">SQL</p>
            <h1 class="text-2xl font-semibold">Query console</h1>
          </div>
          <div class="flex items-center gap-3">
            <button id="themeBtn" class="px-4 py-2 rounded-lg border border-white/10 hover:border-white/30">Theme</button>
            <a class="px-4 py-2 rounded-lg bg-brand-500 hover:bg-brand-400 text-white font-semibold" href="./tables.html">Tables</a>
          </div>
        </header>

        <section class="rounded-xl border border-white/10 bg-white/5 p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 text-sm">
              <label class="flex items-center gap-2"><span>DB</span><select class="rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white focus:border-brand-400 focus:outline-none"><option>demo</option></select></label>
              <label class="flex items-center gap-2"><span>Schema</span><select class="rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-white focus:border-brand-400 focus:outline-none"><option>public</option></select></label>
            </div>
            <div class="flex items-center gap-2">
              <button class="px-3 py-2 rounded-lg border border-white/10 hover:border-white/30" id="formatBtn" type="button">Format</button>
              <button class="px-3 py-2 rounded-lg bg-brand-500 hover:bg-brand-400 text-white font-semibold" id="runBtn" type="button">Run</button>
            </div>
          </div>
          <textarea id="sqlInput" class="w-full rounded-lg border border-white/10 bg-ink/70 px-4 py-3 text-white placeholder:text-slate-400 focus:border-brand-400 focus:outline-none min-h-[200px]" placeholder="SELECT * FROM users LIMIT 20;"></textarea>
          <div class="rounded-lg border border-white/10 bg-white/5 p-4">
            <div class="flex items-center justify-between text-sm text-slate-300">
              <span>Results</span>
              <span id="runStatus">Ready</span>
            </div>
            <div class="overflow-x-auto mt-3">
              <table class="w-full text-sm" id="resultsTable">
                <thead class="text-slate-300">
                  <tr class="text-left"><th class="py-2">id</th><th class="py-2">email</th><th class="py-2">plan</th></tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                  <tr><td class="py-2">c1…91</td><td>sam@example.com</td><td>pro</td></tr>
                  <tr><td class="py-2">a2…77</td><td>jules@example.com</td><td>team</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
