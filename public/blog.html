<script>
  function openModal() {
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
  }
</script>


<script>
const ENDPOINT = "https://cloud.appwrite.io/v1";
const PROJECT_ID = "696ccb6f0007553e40a1";
const DATABASE_ID = "696ccbff00241ca8d15c";
const COLLECTION_ID = "blogs";
const BUCKET_ID = "696cd04d00122e691fb4";
</script>

<script>
async function fetchBlogs() {
  try {
    const res = await fetch(
      `${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents`,
      {
        method: "GET",
        mode: "cors",
        headers: {
          "X-Appwrite-Project": "696ccb6f0007553e40a1",
        },
      }
    );

    const data = await res.json();
    console.log(data);

    if (!res.ok) {
      console.error("Appwrite error:", data);
      return;
    }

    renderBlogs(data.documents);

  } catch (error) {
    console.error("Fetch error:", error);
  }
}

fetchBlogs();
</script>


<script>
function imageUrl(fileId, width = 400) {
  return `${ENDPOINT}/storage/buckets/${BUCKET_ID}/files/${fileId}/preview?width=${width}&project=${PROJECT_ID}`;
}
</script>

<script>
  fetchBlogs();
</script>

<script>
function renderBlogs(blogs) {
  const blogContainer = document.getElementById("blog-body");
  blogContainer.innerHTML = "";

  for (const blog of blogs) {
    let html = 
              ` 
                <div class="p-4 md:w-1/3">
                  <div class="h-full border-2 border-gray-200 border-opacity-60 rounded-lg overflow-hidden">
                    ${blog.thumbnail ? `<img class="lg:h-48 md:h-36 w-full object-cover object-center" src="${imageUrl(blog.thumbnail)}" alt="blog">` : `<img class="lg:h-48 md:h-36 w-full object-cover object-center" src="${blog.thumbnail_url}" alt="blog">`}
                    <div class="p-6">
                      <h2 class="tracking-widest text-xs title-font font-medium text-gray-400 mb-1">${blog.category || 'Tech'}</h2>
                      <h1 class="title-font text-lg font-medium text-gray-900 mb-3">${blog.$createdAt}</h1>
                      <p class="leading-relaxed mb-3">${blog.title}</p>
                      <div class="flex items-center flex-wrap ">
                        <a href="javascript:void(0);" onclick="loadBlogDetails(${blog.id})" class="text-indigo-500 inline-flex items-center md:mb-2 lg:mb-0">Learn More
                          <svg class="w-4 h-4 ml-2" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"></path>
                            <path d="M12 5l7 7-7 7"></path>
                          </svg>
                        </a>
                        <span class="text-gray-400 mr-3 inline-flex items-center lg:ml-auto md:ml-0 ml-auto leading-none text-sm pr-3 py-1 border-r-2 border-gray-200">
                          <svg class="w-4 h-4 mr-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>1.2K
                        </span>
                        <span class="text-gray-400 inline-flex items-center leading-none text-sm">
                          <svg class="w-4 h-4 mr-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path>
                          </svg>6
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              `;

     document.getElementById("blog-body").innerHTML += html;         
  }
}
