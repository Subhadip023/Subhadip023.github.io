<script>
  function openModal() {
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
  }
</script>


<script>
const ENDPOINT = "https://cloud.appwrite.io/v1";
const PROJECT_ID = "696ccb6f0007553e40a1";
const DATABASE_ID = "696ccbff00241ca8d15c";
const COLLECTION_ID = "blogs";
const BUCKET_ID = "696cd04d00122e691fb4";
</script>

<script>
async function fetchBlogs() {
  try {
    const res = await fetch(
      `${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents`,
      {
        method: "GET",
        mode: "cors",
        headers: {
          "X-Appwrite-Project": PROJECT_ID,
        },
      }
    );

    const data = await res.json();
    console.log(data);

    if (!res.ok) {
      console.error("Appwrite error:", data);
      return;
    }

    renderBlogs(data.documents);

  } catch (error) {
    console.error("Fetch error:", error);
  }
}

fetchBlogs();
</script>


<script>
function imageUrl(fileId, width = 400) {
  return `${ENDPOINT}/storage/buckets/${BUCKET_ID}/files/${fileId}/preview?width=${width}&project=${PROJECT_ID}`;
}
</script>

<script>
  fetchBlogs();
</script>

<script>
function renderBlogs(blogs) {
  const blogContainer = document.getElementById("blog-body");
  blogContainer.innerHTML = "";

  for (const blog of blogs) {
    const blogItem = document.createElement("div");
    blogItem.className = "mb-4";

    const blogTitle = document.createElement("h2");
    blogTitle.className = "text-lg font-semibold text-gray-800 mb-2";
    blogTitle.textContent = blog.title;
    blogItem.appendChild(blogTitle);

    const blogImage = document.createElement("img");
    blogImage.className = "mb-2";
    blogImage.src = imageUrl(blog.thumbnail); // ✅ FIXED
    blogItem.appendChild(blogImage);

    const blogDescription = document.createElement("div");
    blogDescription.className = "text-gray-600";
    blogDescription.innerHTML = blog.description; // ✅ FIXED
    blogItem.appendChild(blogDescription);

    blogContainer.appendChild(blogItem);
  }
}
</script>
