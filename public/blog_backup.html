<script>
  function openModal() {
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal').classList.add('flex');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
  }
</script>




  <script>

    const isLocal =
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1';

    if (!isLocal) {
      document.getElementById('add-content')?.remove();
    }
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: 'Write description here...',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          [{ 'list': 'ordered' }, { 'list': 'bullet' }],
          ['link'],
          ['clean']
        ]
      }
    });

    function compressImage(file, maxSizeKB = 500, maxWidth = 1280) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();

        reader.onload = e => {
          img.src = e.target.result;
        };

        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          let width = img.width;
          let height = img.height;

          // Resize if too wide
          if (width > maxWidth) {
            height = height * (maxWidth / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;

          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.9;
          let base64;

          // Reduce quality until under size limit
          do {
            base64 = canvas.toDataURL('image/jpeg', quality);
            quality -= 0.05;
          } while (base64.length / 1024 > maxSizeKB && quality > 0.4);

          resolve(base64);
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }


    function readImageAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleSubmit() {
      const titleInput = document.getElementById('title');
      const imageInput = document.getElementById('image');

      const title = titleInput.value.trim();
      const description = quill.root.innerHTML.trim();
      const isEmptyDescription = quill.getText().trim().length === 0;

      if (!title || isEmptyDescription) {
        alert('Title and description are required');
        return;
      }

      let imageBase64 = null;

      if (imageInput.files.length > 0) {
        const file = imageInput.files[0];

        // // Optional size limit (recommended)
        // if (file.size > 500 * 1024) {
        //   alert('Image must be under 500KB');
        //   return;
        // }

        imageBase64 = await compressImage(file, 200);
      }

      const blogs = JSON.parse(localStorage.getItem('blogs') || '[]');

      const blog = {
        id: Date.now(),
        title,
        description,
        image: imageBase64, // 👈 stored here
        created_at: new Date().toISOString()
      };

      blogs.unshift(blog);
      localStorage.setItem('blogs', JSON.stringify(blogs));



      alert('Blog saved successfully ✅');


      titleInput.value = '';
      imageInput.value = '';
      quill.setText('');
    }


    function loadBlogs() {
      const blogDiv = document.getElementById('blog-body');
      fetch('../data/blogs.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to load blogs.json');
          }
          return response.json(); // 👈 convert to JSON
        })
        .then(blogs => {
          if (blogs.length !== 0) {
            for (const blog of blogs) {
              let html = 
              ` 
                <div class="p-4 md:w-1/3">
                  <div class="h-full border-2 border-gray-200 border-opacity-60 rounded-lg overflow-hidden">
                    <img class="lg:h-48 md:h-36 w-full object-cover object-center" src="${blog.image}" alt="blog">
                    <div class="p-6">
                      <h2 class="tracking-widest text-xs title-font font-medium text-gray-400 mb-1">${blog.category || 'Category'}</h2>
                      <h1 class="title-font text-lg font-medium text-gray-900 mb-3">${blog.created_at}</h1>
                      <p class="leading-relaxed mb-3">${blog.title}</p>
                      <div class="flex items-center flex-wrap ">
                        <a href="javascript:void(0);" onclick="loadBlogDetails(${blog.id})" class="text-indigo-500 inline-flex items-center md:mb-2 lg:mb-0">Learn More
                          <svg class="w-4 h-4 ml-2" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"></path>
                            <path d="M12 5l7 7-7 7"></path>
                          </svg>
                        </a>
                        <span class="text-gray-400 mr-3 inline-flex items-center lg:ml-auto md:ml-0 ml-auto leading-none text-sm pr-3 py-1 border-r-2 border-gray-200">
                          <svg class="w-4 h-4 mr-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                          </svg>1.2K
                        </span>
                        <span class="text-gray-400 inline-flex items-center leading-none text-sm">
                          <svg class="w-4 h-4 mr-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path>
                          </svg>6
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              `;
              blogDiv.innerHTML += html;
            }
          }

        })
        .catch(error => {
          console.error(error);
        });
    }

    loadBlogs();


    function exportBlogs() {
      const blogs = localStorage.getItem('blogs');
      if (!blogs) {
        alert('No blogs found');
        return;
      }

      const blob = new Blob([blogs], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'blogs.json';
      a.click();

      URL.revokeObjectURL(url);
    }


    function loadBlogDetails(id) {
      openModal();

      const blogs = fetch('../data/blogs.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to load blogs.json');
          }
          return response.json(); // 👈 convert to JSON
        })
        .then(blogs => {
          const blog = blogs.find(blog => blog.id === id);
          if (blog) {
            document.getElementById('modal-title').innerHTML = blog.title;
            document.getElementById('modal-body').innerHTML = blog.description;
          }
        })
        .catch(error => {
          console.error(error);
        });
     
    }

  </script>
