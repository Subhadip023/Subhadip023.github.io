<script>
const ENDPOINT = "https://cloud.appwrite.io/v1";
const PROJECT_ID = "696ccb6f0007553e40a1";
const DATABASE_ID = "696ccbff00241ca8d15c";
const COLLECTION_ID = "blogs";
const BUCKET_ID = "696cd04d00122e691fb4";
const DOCUMENT_ID = new URLSearchParams(window.location.search).get("id");

async function fetchSinglePost(DOCUMENT_ID) {
  const res = await fetch(
    `${ENDPOINT}/databases/${DATABASE_ID}/collections/${COLLECTION_ID}/documents/${DOCUMENT_ID}`,
    {
      headers: {
        "X-Appwrite-Project": PROJECT_ID
      }
    }
  );

  const data = await res.json();

  let html = `<section class="text-gray-600 body-font">
  <div class="container mx-auto flex px-5 py-24 items-center justify-left flex-col">
    <img class=" mb-10 object-cover object-left rounded" alt="${data.title}" src="${data.thumbnail==null? data.thumbnail_url : data.thumbnail}">
    <div class="text-justify lg:w-2/3 w-full">
      <h1 class="title-font sm:text-4xl text-3xl mb-4 font-medium text-gray-900">${data.title}</h1>
      ${data.description}
      <div class="flex justify-center">
        <a href="/" class="inline-flex text-white bg-blue-500 border-0 py-2 px-6 focus:outline-none hover:bg-blue-600 rounded text-lg">Home</a>
        <a href="../public/blog.html" class="ml-4 inline-flex text-gray-700 bg-gray-100 border-0 py-2 px-6 focus:outline-none hover:bg-gray-200 rounded text-lg">Blogs</a>
      </div>
    </div>
  </div>
</section>`;
  document.getElementById("blog-details").innerHTML = html;
  
}

fetchSinglePost(DOCUMENT_ID);
</script>
